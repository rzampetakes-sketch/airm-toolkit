<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corporate Portal Login — AURUM</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-navy-950 px-4 font-sans text-slate-100 antialiased">

  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <a href="/" class="inline-flex items-center gap-2">
        <span class="flex h-10 w-10 items-center justify-center rounded-md bg-gradient-to-br from-gold-300 to-gold-600 font-serif text-lg font-bold text-navy-950">A</span>
        <span class="font-serif text-2xl font-bold tracking-widest text-white">AURUM</span>
      </a>
      <p class="mt-2 text-xs uppercase tracking-widest text-slate-400">Corporate Travel Desk</p>
    </div>

    <div class="panel-card">
      <h1 class="mb-4 font-serif text-lg font-semibold text-white">Sign in to your account</h1>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="field-label" for="email">Email</label>
          <input id="email" type="email" class="field-input" required autocomplete="username" />
        </div>
        <div>
          <label class="field-label" for="password">Password</label>
          <input id="password" type="password" class="field-input" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="hidden text-sm text-rose-400"></p>
        <button type="submit" class="btn-gold w-full">Sign In</button>
      </form>

      <div class="mt-5 rounded-md border border-navy-600 bg-navy-900/60 p-3 text-xs text-slate-400">
        <p class="mb-1 font-semibold text-slate-300">Demo credentials</p>
        <p>Admin: admin@corporatetravel.example / AdminDemo123!</p>
        <p>Corporate client: travel.manager@meridiancapital.example / ClientDemo123!</p>
      </div>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500"><a href="/" class="text-gold-400 hover:underline">← Back to flight search</a></p>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
